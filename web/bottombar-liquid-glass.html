<!DOCTYPE html>
<!--
  底栏液态玻璃 · Web 演示(自包含,双击打开即用)
  技术路线:shuding/liquid-glass(MIT)→ xiaofangstudio/liquid-glass-web(MIT)
  本文件把该折射技术适配为"底部导航栏"场景,原创部分 MIT。

  原理:Canvas 按 SDF 生成位移贴图 → feImage → feDisplacementMap 弯曲真实背景
  兼容:仅 Chromium 系(Chrome/Edge)支持 backdrop-filter:url(#svg);其余自动降级毛玻璃
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>底栏液态玻璃 · Liquid Glass Bottom Bar</title>
<style>
  :root {
    --bar-h: 64px;
    --bar-w: min(420px, calc(100vw - 32px));
    --bend: 14px;             /* 折射强度(最大位移 px) */
    --tint: rgba(255, 255, 255, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff; overflow-x: hidden;
    /* 彩色渐变壁纸:给折射提供"素材" */
    background:
      radial-gradient(60% 45% at 15% 12%, #ff5f6d 0%, transparent 70%),
      radial-gradient(55% 40% at 90% 30%, #6a82fb 0%, transparent 70%),
      radial-gradient(50% 40% at 25% 55%, #ffc371 0%, transparent 70%),
      radial-gradient(55% 45% at 85% 85%, #38b6ff 0%, transparent 70%),
      linear-gradient(180deg, #ffd9e8 0%, #c7d8ff 50%, #b9f5d0 100%);
    background-attachment: fixed;
  }
  header { padding: 64px 24px 16px; text-shadow: 0 1px 8px rgba(0,0,0,.25); }
  header h1 { font-size: 34px; font-weight: 600; }
  header p  { margin-top: 6px; font-size: 14px; opacity: .9; }

  .cards { padding: 8px 20px 180px; display: grid; gap: 14px; }
  .card {
    height: 96px; border-radius: 22px; display: flex; align-items: center;
    padding: 0 20px; font-weight: 600; font-size: 15px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2);
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
  }
  .card:nth-child(4n+1) { background: linear-gradient(120deg, #ff5f6d, #ffc371); }
  .card:nth-child(4n+2) { background: linear-gradient(120deg, #6a82fb, #38b6ff); }
  .card:nth-child(4n+3) { background: linear-gradient(120deg, #059669, #34d399); }
  .card:nth-child(4n+4) { background: linear-gradient(120deg, #7c3aed, #ec4899); }

  /* ─────────── 底栏:液态玻璃 ─────────── */
  .glass-bar {
    position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: var(--bar-w); height: var(--bar-h);
    border-radius: calc(var(--bar-h) / 2);
    /* 滤镜链:url() 折射在前,后面的 CSS 滤镜做表面质感(顺序敏感) */
    backdrop-filter: url(#glass-filter) blur(0.25px) contrast(1.2) brightness(1.05) saturate(1.1);
    -webkit-backdrop-filter: blur(14px);
    background: var(--tint);                       /* 白 tint:偏白不偏灰 */
    box-shadow: 0 4px 8px rgba(0,0,0,.25),
                0 -10px 25px inset rgba(0,0,0,.15),/* 底部内阴影出"厚"感 */
                0 1px 0 rgba(255,255,255,.35) inset; /* 顶部边缘高光 */
    display: flex; align-items: center;
    padding: 4px; position: fixed;
    transition: transform .18s ease;
    user-select: none;
  }
  .glass-bar.pressing { transform: translateX(-50%) scale(1.02, 0.95); } /* 按压压扁 */

  /* 选中指示器:随 tab 滑动的小玻璃胶囊 */
  .indicator {
    position: absolute; top: 6px; bottom: 6px; width: calc((100% - 8px) / 4);
    border-radius: 999px;
    background: rgba(255,255,255,.16);
    box-shadow: 0 -6px 14px inset rgba(0,0,0,.12), 0 1px 0 rgba(255,255,255,.4);
    transition: transform .45s cubic-bezier(.22,1.4,.36,1); /* 弹簧过冲 */
    will-change: transform;
  }
  .tab {
    flex: 1; height: 100%; border: 0; background: none; color: rgba(255,255,255,.72);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 11px; cursor: pointer; position: relative; z-index: 1;
    transition: color .2s, transform .25s cubic-bezier(.22,1.4,.36,1);
  }
  .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .tab.active { color: #fff; font-weight: 600; transform: scale(1.12); } /* 选中:放大+提亮 */

  /* 降级:非 Chromium(检测不到 backdrop-filter:url)加 .fallback */
  .glass-bar.fallback {
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(255,255,255,.55); color: #222;
  }
  .glass-bar.fallback .tab { color: rgba(0,0,0,.55); }
  .glass-bar.fallback .tab.active { color: #111; }
  .glass-bar.fallback .indicator { background: rgba(255,255,255,.6); }

  .hint {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; padding: 6px 14px; border-radius: 999px;
    background: rgba(0,0,0,.35); backdrop-filter: blur(8px);
  }
</style>
</head>
<body>
<div class="hint" id="hint">Chromium 下滚动页面,观察底栏对背后内容的实时折射</div>

<header>
  <h1>液态玻璃底栏</h1>
  <p>iOS 26 Liquid Glass · Web 复刻(位移贴图折射 · 非美术贴图)</p>
</header>

<div class="cards" id="cards"></div>

<!-- 底栏本体 -->
<nav class="glass-bar" id="bar" aria-label="主导航">
  <div class="indicator" id="indicator"></div>
  <button class="tab active" data-i="0">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>首页
  </button>
  <button class="tab" data-i="1">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.8-3.8"/></svg>搜索
  </button>
  <button class="tab" data-i="2">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>我的
  </button>
  <button class="tab" data-i="3">
    <svg viewBox="0 0 24 24"><path d="M12 3v13"/><path d="m6.5 10.5 5.5 5.5 5.5-5.5"/><path d="M5 20h14"/></svg>下载
  </button>
</nav>

<!-- SVG 折射滤镜:feImage(位移贴图) + feDisplacementMap -->
<svg width="0" height="0" style="position:absolute">
  <filter id="glass-filter" x="-10%" y="-10%" width="120%" height="120%"
          filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="blur"/>
    <feImage id="map-image" result="map" preserveAspectRatio="none"/>
    <feDisplacementMap id="disp" in="blur" in2="map" scale="28"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<canvas id="map-canvas" width="0" height="0" style="display:none"></canvas>

<script>
/* ───────────────────────── 折射引擎(移植自 shuding/liquid-glass 思路) ─────────────────────────
 * 与 web 版按钮做法的关键差异:底栏是"宽扁胶囊",SDF 按真实像素尺寸计算,
 * 内缩(inset)取固定像素而非归一化 0.3/0.2,否则扁长元素上折射带会被挤没。 */
const bar = document.getElementById('bar');
const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const mapImage = document.getElementById('map-image');
const disp = document.getElementById('disp');

const INSET = 6;        // 折射带内缩 px(血泪陷阱:SDF 不能撑满元素)
const EDGE_RAMP = 18;   // 边缘→中心的强度过渡带宽 px

function sdRoundedRect(px, py, hw, hh, r) {
  const qx = Math.abs(px) - hw + r, qy = Math.abs(py) - hh + r;
  return Math.min(Math.max(qx, qy), 0) + Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) - r;
}
function smoothStep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/** 生成位移贴图:bendPx = 最大折射位移(px),press = 按压加厚倍数 */
function rebuildMap(bendPx, press = 1) {
  const w = Math.max(2, Math.round(bar.offsetWidth * devicePixelRatio));
  const h = Math.max(2, Math.round(bar.offsetHeight * devicePixelRatio));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }

  const hw = w / 2 - INSET * devicePixelRatio;
  const hh = h / 2 - INSET * devicePixelRatio;
  const r = hh;                                   // pill:半径 = 半高
  const ramp = EDGE_RAMP * devicePixelRatio;
  const inset = INSET * devicePixelRatio;
  const strength = 1.3 * press;                   // 按压加厚(阈值 ÷1.3 的等价做法)

  const img = ctx.createImageData(w, h);
  const F = new Float32Array(w * h * 2);          // 原始位移场(px)
  let maxMag = 0;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ix = (x - w / 2) / w, iy = (y - h / 2) / h;   // 归一化居中坐标
      const d = sdRoundedRect(x - w / 2, y - h / 2, hw, hh, r);
      // 强度:深处 1 → 边缘 0(中心放大感,边缘弯曲一圈)
      const s = smoothStep(inset + ramp, inset, d) * strength;
      const i = (y * w + x) * 2;
      F[i] = ix * s; F[i + 1] = iy * s;
      const m = Math.abs(F[i]) + Math.abs(F[i + 1]);
      if (m > maxMag) maxMag = m;
    }
  }
  /* 归一化(对应原版 maxScale 折半):贴图 = F/(2M)+0.5,feDisplacementMap scale = 2M·bendPx */
  const M = Math.max(maxMag, 1e-6);
  const scale = 2 * M * bendPx * devicePixelRatio;
  for (let p = 0; p < w * h; p++) {
    img.data[p * 4]     = Math.round((F[p * 2]     / (2 * M) + 0.5) * 255);
    img.data[p * 4 + 1] = Math.round((F[p * 2 + 1] / (2 * M) + 0.5) * 255);
    img.data[p * 4 + 2] = 128;
    img.data[p * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  mapImage.setAttribute('href', canvas.toDataURL());
  mapImage.setAttribute('width', bar.offsetWidth);
  mapImage.setAttribute('height', bar.offsetHeight);
  disp.setAttribute('scale', scale);
}

/* ───────────────────────── 降级检测 ───────────────────────── */
const supportsRefraction =
  CSS.supports('backdrop-filter', 'url(#glass-filter)') &&
  /Chrome|Chromium/.test(navigator.userAgent) && !/Firefox/.test(navigator.userAgent);
if (!supportsRefraction) {
  bar.classList.add('fallback');
  document.getElementById('hint').textContent = '当前浏览器不支持 SVG 位移折射,已降级为毛玻璃(建议 Chrome/Edge)';
}

/* ───────────────────────── 交互:tab 切换 + 按压 ───────────────────────── */
const tabs = [...document.querySelectorAll('.tab')];
const indicator = document.getElementById('indicator');
function moveIndicator(el) {
  const barRect = bar.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  indicator.style.transform = `translateX(${r.left - barRect.left - 4}px)`;
}
tabs.forEach(t => {
  t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    moveIndicator(t);
  });
});
if (supportsRefraction) {
  bar.addEventListener('pointerdown', () => { bar.classList.add('pressing'); rebuildMap(+getComputedStyle(document.documentElement).getPropertyValue('--bend').replace('px','') || 14, 1.3); });
  addEventListener('pointerup', () => { bar.classList.remove('pressing'); rebuildMap(+getComputedStyle(document.documentElement).getPropertyValue('--bend').replace('px','') || 14, 1); });
}

/* ───────────────────────── 内容 + 尺寸监听 ───────────────────────── */
const cards = document.getElementById('cards');
for (let i = 1; i <= 12; i++) {
  const c = document.createElement('div');
  c.className = 'card'; c.textContent = `卡片 ${i} · 向下滚动,看玻璃折射`;
  cards.appendChild(c);
}
new ResizeObserver(() => rebuildMap(14)).observe(bar);
addEventListener('load', () => rebuildMap(14));
rebuildMap(14);
</script>
</body>
</html>
